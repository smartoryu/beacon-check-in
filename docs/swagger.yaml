info:
  contact: {}
  description: REST API for Beacon Check-In, an iBeacon attendance system. Admins
    register and place beacons on event floor plans; users check in from the Flutter
    app using nearby beacon readings. Interactive documentation is available at /api-docs
    and the raw OpenAPI document at /api/openapi.json.
  title: Beacon Check-In API
  version: "1.0"
paths:
  /api/v1/admins:
    get:
      description: Lists admin and super admin accounts, including soft-deleted when
        requested.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: List admins
      tags:
      - Admin Management
    post:
      consumes:
      - application/json
      description: Creates an admin account and returns a one-time temporary password.
      parameters:
      - description: Admin payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.TemporaryPasswordResponse'
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an admin
      tags:
      - Admin Management
  /api/v1/admins/{id}:
    delete:
      description: Soft-deletes an admin and revokes their sessions.
      parameters:
      - description: Admin ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an admin
      tags:
      - Admin Management
    get:
      description: Returns an admin or super admin by id.
      parameters:
      - description: Admin ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get an admin
      tags:
      - Admin Management
    put:
      consumes:
      - application/json
      description: Updates an admin's name and email. Roles are immutable.
      parameters:
      - description: Admin ID
        in: path
        name: id
        required: true
        type: string
      - description: Admin payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update an admin
      tags:
      - Admin Management
  /api/v1/admins/{id}/reset-password:
    post:
      description: Generates a new one-time temporary password and forces a change
        on next sign-in.
      parameters:
      - description: Admin ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reset an admin password
      tags:
      - Admin Management
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Updates the authenticated user's password and clears the forced-change
        flag.
      parameters:
      - description: Password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change the current user's password
      tags:
      - Auth - Account
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user's profile, role and onboarding flags.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - Auth - Account
  /api/v1/auth/password:
    post:
      consumes:
      - application/json
      description: Sets a new password for a user
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: Password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.SetPasswordRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set user password
      tags:
      - Auth - User Password
  /api/v1/auth/password/{userId}:
    put:
      consumes:
      - application/json
      description: Updates an existing user's password
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Password payload
        in: body
        name: body
        required: true
        schema:
