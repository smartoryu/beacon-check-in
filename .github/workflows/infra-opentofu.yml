name: Infra OpenTofu

on:
  pull_request:
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/infra-opentofu.yml"
  push:
    branches: [main]
    paths:
      - "infra/opentofu/**"
      - ".github/workflows/infra-opentofu.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Run a plan or apply the saved plan"
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-opentofu
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  preflight:
    name: Check infra secrets
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets and variables
        id: check
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          ADMIN_CIDR: ${{ vars.ADMIN_CIDR }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          gcp_ok=false
          if [ -n "$GCP_WIF_PROVIDER" ] && [ -n "$GCP_SERVICE_ACCOUNT" ]; then gcp_ok=true; fi
          if [ -n "$GCP_SA_KEY" ]; then gcp_ok=true; fi
          if [ -n "$GCP_PROJECT_ID" ] && [ -n "$TF_STATE_BUCKET" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$DEPLOY_SSH_PUBLIC_KEY" ] && [ -n "$ADMIN_CIDR" ] && [ "$gcp_ok" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OpenTofu skipped: configure GCP credentials, TF_STATE_BUCKET, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE_ID, DEPLOY_SSH_PUBLIC_KEY and ADMIN_CIDR."
          fi

  plan:
    name: OpenTofu plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: preflight
    if: >
      needs.preflight.outputs.ready == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.action == 'plan')
    defaults:
      run:
        working-directory: infra/opentofu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.1"

      - name: Authenticate to GCP (Workload Identity Federation)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP (service account key fallback)
        if: env.GCP_WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: OpenTofu fmt
        run: tofu fmt -check -recursive

      - name: OpenTofu init
        run: |
          tofu init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=beacon-check-in/infra"

      - name: OpenTofu validate
        run: tofu validate

      - name: OpenTofu plan
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
          TF_VAR_gcp_zone: ${{ vars.GCP_ZONE || 'us-central1-a' }}
          TF_VAR_instance_name: ${{ vars.API_INSTANCE_NAME || 'beacon-check-in-api' }}
          TF_VAR_machine_type: ${{ vars.API_MACHINE_TYPE || 'e2-micro' }}
          TF_VAR_disk_size_gb: ${{ vars.API_DISK_SIZE_GB || 30 }}
          TF_VAR_image_family: ${{ vars.API_IMAGE_FAMILY || 'ubuntu-2404-lts-amd64' }}
          TF_VAR_ssh_user: ${{ vars.DEPLOY_USER || 'deploy' }}
          TF_VAR_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
          TF_VAR_domain: ${{ vars.API_DOMAIN || 'beacon-check-in-api.playground.my.id' }}
          TF_VAR_web_domain: ${{ vars.WEB_DOMAIN || 'admin-beacon-check-in.playground.my.id' }}
          TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME || 'playground.my.id' }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_proxied: "true"
        run: tofu plan -input=false -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan
          path: infra/opentofu/tfplan
          retention-days: 7

  apply:
    name: OpenTofu apply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    needs: preflight
    if: >
      needs.preflight.outputs.ready == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'apply'
    defaults:
      run:
        working-directory: infra/opentofu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13.1"

      - name: Authenticate to GCP (Workload Identity Federation)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP (service account key fallback)
        if: env.GCP_WIF_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: OpenTofu init
        run: |
          tofu init \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=beacon-check-in/infra"

      - name: OpenTofu plan
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
          TF_VAR_gcp_zone: ${{ vars.GCP_ZONE || 'us-central1-a' }}
          TF_VAR_instance_name: ${{ vars.API_INSTANCE_NAME || 'beacon-check-in-api' }}
          TF_VAR_machine_type: ${{ vars.API_MACHINE_TYPE || 'e2-micro' }}
          TF_VAR_disk_size_gb: ${{ vars.API_DISK_SIZE_GB || 30 }}
          TF_VAR_image_family: ${{ vars.API_IMAGE_FAMILY || 'ubuntu-2404-lts-amd64' }}
          TF_VAR_ssh_user: ${{ vars.DEPLOY_USER || 'deploy' }}
          TF_VAR_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
          TF_VAR_domain: ${{ vars.API_DOMAIN || 'beacon-check-in-api.playground.my.id' }}
          TF_VAR_web_domain: ${{ vars.WEB_DOMAIN || 'admin-beacon-check-in.playground.my.id' }}
          TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME || 'playground.my.id' }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_proxied: "true"
        run: tofu plan -input=false -out=tfplan

      - name: OpenTofu apply
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
          TF_VAR_gcp_zone: ${{ vars.GCP_ZONE || 'us-central1-a' }}
          TF_VAR_instance_name: ${{ vars.API_INSTANCE_NAME || 'beacon-check-in-api' }}
          TF_VAR_machine_type: ${{ vars.API_MACHINE_TYPE || 'e2-micro' }}
          TF_VAR_disk_size_gb: ${{ vars.API_DISK_SIZE_GB || 30 }}
          TF_VAR_image_family: ${{ vars.API_IMAGE_FAMILY || 'ubuntu-2404-lts-amd64' }}
          TF_VAR_ssh_user: ${{ vars.DEPLOY_USER || 'deploy' }}
          TF_VAR_ssh_public_key: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
          TF_VAR_domain: ${{ vars.API_DOMAIN || 'beacon-check-in-api.playground.my.id' }}
          TF_VAR_web_domain: ${{ vars.WEB_DOMAIN || 'admin-beacon-check-in.playground.my.id' }}
          TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME || 'playground.my.id' }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_proxied: "true"
        run: tofu apply -input=false -auto-approve tfplan
