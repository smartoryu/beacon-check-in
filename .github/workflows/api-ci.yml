name: API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "infra/deploy/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "infra/deploy/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and image smoke build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Download modules
        working-directory: apps/api
        run: go mod download

      - name: Generate Swagger docs
        working-directory: apps/api
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          "$(go env GOPATH)/bin/swag" init -o docs -d cmd,internal,modules --parseDependency

      - name: Vet
        working-directory: apps/api
        run: go vet ./...

      - name: Test
        working-directory: apps/api
        run: go test ./internal/... ./modules/... ./pkg/... -count=1 -timeout 15m

      - name: Build production binary
        working-directory: apps/api
        run: CGO_ENABLED=0 go build -tags prod -trimpath -buildvcs=false -o /tmp/beacon-api ./cmd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          tags: beacon-check-in-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
