name: Web Release

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared-ui/**"
      - "infra/deploy/web/**"
      - ".github/workflows/web-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    name: Publish web image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/beacon-check-in-web
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=https://${{ vars.API_DOMAIN || 'beacon-check-in-api.playground.my.id' }}/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
